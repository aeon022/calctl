version: 2

project_name: calctl

before:
  hooks:
    - go mod tidy
    - sh -c 'rm -rf completions && mkdir completions && for s in bash zsh fish; do go run . completion $s > completions/calctl.$s; done'

builds:
  - main: .
    binary: calctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/aeon022/calctl/cmd.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

# Publishing to the Homebrew tap requires the HOMEBREW_TAP_TOKEN secret
# (fine-grained PAT with contents:write on aeon022/homebrew-tap).
brews:
  - repository:
      owner: aeon022
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/aeon022/calctl
    license: MIT
    description: "Calendar management from your terminal - local-first CLI/TUI for Apple Calendar"
    install: |
      bin.install "calctl"
      bash_completion.install "completions/calctl.bash" => "calctl"
      zsh_completion.install "completions/calctl.zsh" => "_calctl"
      fish_completion.install "completions/calctl.fish"
    test: |
      system "#{bin}/calctl", "version"
