name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # PAT with contents:write on aeon022/missionctl-releases (private) —
          # the release now goes there, not to this repo, so the default
          # Actions-scoped GITHUB_TOKEN doesn't have the needed permission.
          GITHUB_TOKEN: ${{ secrets.PRIVATE_RELEASES_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
